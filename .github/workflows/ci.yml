name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Scan Git history for secrets
        run: |
          curl --fail --silent --show-error --location https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o "$RUNNER_TEMP/gitleaks.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --log-opts=--all --redact --no-banner .

  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.10"
          - os: ubuntu-latest
            python: "3.13"
          - os: windows-latest
            python: "3.13"
          - os: macos-15
            python: "3.13"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install .
      - run: python tests/test_route.py
      - run: python tests/test_grid.py
      - run: python tests/test_measurements.py
      - run: python tests/test_statistics.py
      - run: python tests/test_profiles.py
      - run: python tests/test_planning.py

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip build
      - run: python -m build
      - name: Install and import built artifacts
        run: |
          python - <<'PY'
          import glob
          import os
          import subprocess
          import sys

          smoke = (
              "import importlib.metadata, importlib.resources, flypath_engine; "
              "assert flypath_engine.__version__ == importlib.metadata.version('flypath-engine'); "
              "assert importlib.resources.files('flypath_engine').joinpath('profiles/drones.json').is_file()"
          )
          for artifact in [*glob.glob("dist/*.tar.gz"), *glob.glob("dist/*.whl")]:
              subprocess.run([sys.executable, "-m", "pip", "install", "--force-reinstall", artifact], check=True)
              subprocess.run([sys.executable, "-c", smoke], cwd=os.environ["RUNNER_TEMP"], check=True)
          PY
      - uses: actions/upload-artifact@v6
        with:
          name: flypath-engine-dist
          path: dist/*
